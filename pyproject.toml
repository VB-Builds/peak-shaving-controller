[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peak-shaving-controller"
version = "0.1.0"
description = "Battery peak shaving against a monthly demand charge: fixed-threshold, forecast-LP and perfect-hindsight controllers on a simulated 15-min factory load."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11", "matplotlib>=3.8"]

[project.optional-dependencies]
modbus = ["pymodbus>=3.8,<3.9"]
dev = ["pytest>=8", "ruff>=0.5", "pymodbus>=3.8,<3.9"]

[tool.setuptools]
packages = ["peak_shaving"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:asyncio"

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["peak_shaving"]
